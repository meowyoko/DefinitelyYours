# Example: HTTPS entry for the game-phone plugin behind nginx.
# Put this inside the `server { listen 443 ssl; server_name YOUR.DOMAIN; ... }` block
# of a site that already has a valid certificate.
#
# Upstream: where server.py listens (PHONE_HOST:PHONE_PORT in .env).
#   - nginx on the same host:            127.0.0.1:3900
#   - nginx in Docker (e.g. Nginx Proxy Manager): the Docker network gateway,
#     e.g. 172.17.0.1:3900 or 172.19.0.1:3900 — set PHONE_HOST to that address.
#
# Nginx Proxy Manager users: add a Custom Location "/phone/" -> http, <gateway ip>, 3900,
# and paste the two proxy_* timeout/buffering lines into its advanced box.
location /phone/ {
    proxy_pass http://127.0.0.1:3900;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 120s;   # a turn can wait ~1 min for the AI, plus TTS
    proxy_send_timeout 120s;
}
