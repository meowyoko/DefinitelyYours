<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&family=Silkscreen&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:400px;overflow:hidden;background:#0b1022}
body{position:relative;font-family:'Pixelify Sans'}
.bg{position:absolute;inset:0;background:radial-gradient(900px 420px at 80% 50%,#1d2d5c 0%,#121a3a 50%,#0b1022 80%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(120,200,255,.05) 2px,transparent 2px),linear-gradient(90deg,rgba(120,200,255,.05) 2px,transparent 2px);background-size:40px 40px}
.star{position:absolute;background:#cfe6ff}
.wrap{position:absolute;left:70px;top:44px}
.strikebox{position:relative;display:inline-block}
.strike{font-size:46px;color:#7f8bb0;letter-spacing:2px}
.line{position:absolute;left:-6px;top:52%;height:8px;background:#ff5c7a;transform:rotate(-4deg);transform-origin:left center}
.def{font-weight:700;font-size:118px;line-height:1;color:#7fe7ff;letter-spacing:2px;margin-top:2px}
.row{display:flex;align-items:flex-end;gap:30px}
.yours{font-weight:700;font-size:118px;line-height:1;color:#ffd27a;letter-spacing:2px}
.zh{font-family:'ZCOOL QingKe HuangYou';font-size:56px;color:#fff;margin-bottom:12px;letter-spacing:8px;text-shadow:3px 3px 0 #2a3a7a}
.phone{position:absolute;right:120px;top:120px;width:200px;height:160px}
.ring{position:absolute;border:6px solid #ffd27a;border-radius:50%}
.handset{position:absolute;left:50px;top:40px;font-size:96px;line-height:1;color:#ffd27a}
.num{position:absolute;right:70px;bottom:46px;font-family:'Silkscreen';font-size:30px;color:#ffd27a;background:#1a2550;border:4px solid #ffd27a;padding:4px 14px;box-shadow:5px 5px 0 #070b18}
.caret{display:inline-block;width:14px;height:48px;background:#fff;margin-left:6px;vertical-align:-4px}
</style></head><body>
<div class="bg"></div><div class="grid"></div><div id="stars"></div>
<div class="wrap" id="wrap">
 <div class="strikebox"><span class="strike">Probably</span><div class="line" id="line"></div></div>
 <div class="def" id="def">Definitely</div>
 <div class="row"><div class="yours" id="yours">Yours</div><div class="zh">一定是你的<span class="caret" id="caret"></span></div></div>
</div>
<div class="phone" id="phone"><div class="handset" id="hs">☎</div></div>
<div class="num" id="num">CALLING</div>
<script>
let seed=11;const r=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
const stars=[];const S=document.getElementById('stars');
for(let i=0;i<80;i++){const d=document.createElement('div');d.className='star';const z=r()<.15?6:3;d.style.width=d.style.height=z+'px';d.style.left=(r()*1280)+'px';d.style.top=(r()*400)+'px';d.dataset.ph=r()*6.28;d.dataset.sp=1+Math.floor(r()*3);S.appendChild(d);stars.push(d)}
const N=48;
window.setFrame=function(f){
  const t=f/N; // 0..1 loop
  // stars twinkle
  for(const s of stars){const a=.35+.65*Math.max(0,Math.sin(t*6.283*s.dataset.sp+ +s.dataset.ph));s.style.opacity=a.toFixed(2)}
  // strike line draws in during first 25%, then holds
  const L=document.getElementById('line');const w=Math.min(1,t/0.25);L.style.width=(Math.round(w*12)/12*250)+'px';
  // neon flicker on Definitely: mostly on, two quick dips
  const D=document.getElementById('def');
  const dip=(f===30||f===32)?0.35:(f===31?0.7:1);
  D.style.opacity=dip;
  D.style.textShadow=`6px 6px 0 #1c4b8f, 0 0 ${18+10*Math.sin(t*6.283*2)}px rgba(127,231,255,${0.45*dip})`;
  // jitter on Yours when phone rings (frames 6-14)
  const Y=document.getElementById('yours');
  const ring=(f>=6&&f<=14)||(f>=22&&f<=26);
  const jx=ring?((f%2)?3:-3):0, jy=ring?((f%3)-1)*2:0;
  Y.style.transform=`translate(${jx}px,${jy}px)`;
  Y.style.textShadow=`6px 6px 0 #8a3b2c, 0 0 ${ring?34:22}px rgba(255,190,110,.5)`;
  // handset shake + rings
  const H=document.getElementById('hs');H.style.transform=ring?`rotate(${(f%2)?-14:14}deg)`:'rotate(0)';
  const P=document.getElementById('phone');P.querySelectorAll('.ring').forEach(e=>e.remove());
  if(ring){for(let k=0;k<2;k++){const e=document.createElement('div');e.className='ring';const sz=110+((f-6+k*4)%8)*14;e.style.width=e.style.height=sz+'px';e.style.left=(98-sz/2)+'px';e.style.top=(88-sz/2)+'px';e.style.opacity=(1-((f-6+k*4)%8)/8).toFixed(2);P.appendChild(e)}}
  document.getElementById('num').textContent='CALLING'+'.'.repeat(Math.floor(f/4)%4).padEnd(3,'\u00a0');
  // caret blink
  document.getElementById('caret').style.opacity=(Math.floor(f/6)%2)?0:1;
};
window.setFrame(0);
</script>
</body></html>
